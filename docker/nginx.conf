server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/site/dist;
    index index.html;

    location / {
        # 支持 /day/YYYY-MM-DD/ 这样的目录型静态页
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
