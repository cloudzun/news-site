services:
  news-site:
    build: .
    image: news-site:latest
    container_name: news-site
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # 挂载数据目录：latest.json 与 7 天归档，容器重启不丢
      - news-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  news-data:
