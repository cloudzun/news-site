name: Build and push Docker image to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 未配置 DOCKERHUB_* secrets 时只构建验证，不推送（保证 CI 不红）
      - name: Log in to Docker Hub
        if: env.DH_USERNAME != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}

      - name: Build image (no push)
        if: env.DH_USERNAME == '' || env.DH_TOKEN == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: news-site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub
        if: env.DH_USERNAME != '' && env.DH_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DH_USERNAME }}/news-site:latest
            ${{ env.DH_USERNAME }}/news-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
